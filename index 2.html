<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Bot Simulation</title>
  <style>
    body {
      background-color: #12161f;
      color: #ffffff;
      font-family: monospace;
      padding: 20px;
    }
    h2 {
      color: #4ade80;
    }
    #output {
      background-color: #171d29;
      border: 1px solid #374151;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h2>Trading Bot Output</h2>
  <div id="output"></div>

  <script>
    class SimpleTradingBot {
      constructor(symbol, initialBalance = 1000) {
        this.symbol = symbol;
        this.balance = initialBalance;
        this.position = 0; // Number of shares held
        this.priceHistory = [];
      }

      // Calculate Simple Moving Average (SMA)
      calculateSMA(period) {
        if (this.priceHistory.length < period) return null;
        const slice = this.priceHistory.slice(-period);
        const sum = slice.reduce((acc, price) => acc + price, 0);
        return sum / period;
      }

      // Process a new incoming market price update
      onPriceUpdate(currentPrice) {
        this.priceHistory.push(currentPrice);

        const shortSMA = this.calculateSMA(3); // Fast moving average
        const longSMA = this.calculateSMA(5);  // Slow moving average

        if (!shortSMA || !longSMA) {
          this.log(`[${this.symbol}] Collecting price data... (${this.priceHistory.length}/5)`);
          return;
        }

        this.log(`[${this.symbol}] Price: $${currentPrice.toFixed(2)} | Short SMA: ${shortSMA.toFixed(2)} | Long SMA: ${longSMA.toFixed(2)}`);

        // Bullish crossover: Buy signal
        if (shortSMA > longSMA && this.position === 0) {
          this.executeBuy(currentPrice);
        } 
        // Bearish crossover: Sell signal
        else if (shortSMA < longSMA && this.position > 0) {
          this.executeSell(currentPrice);
        }
      }

      executeBuy(price) {
        const sharesToBuy = Math.floor(this.balance / price);
        if (sharesToBuy > 0) {
          this.position = sharesToBuy;
          const cost = sharesToBuy * price;
          this.balance -= cost;
          this.log(`🟢 BUY: ${sharesToBuy} shares at $${price.toFixed(2)} (Spent: $${cost.toFixed(2)}, Cash Left: $${this.balance.toFixed(2)})`);
        }
      }

      executeSell(price) {
        const revenue = this.position * price;
        this.balance += revenue;
        this.log(`🔴 SELL: ${this.position} shares at $${price.toFixed(2)} (Received: $${revenue.toFixed(2)}, Total Cash: $${this.balance.toFixed(2)})`);
        this.position = 0;
      }

      log(message) {
        console.log(message);
        const outputDiv = document.getElementById("output");
        if (outputDiv) {
          outputDiv.innerHTML += message + "<br>";
        }
      }
    }

    // Run simulation
    const bot = new SimpleTradingBot("NKE", 1000);
    const simulatedPrices = [75.0, 75.5, 76.0, 77.2, 78.4, 77.0, 76.2, 75.8, 77.0, 78.5];

    simulatedPrices.forEach(price => bot.onPriceUpdate(price));
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Trade Card Container -->
  <div class="bg-[#121620] border border-[#1e2638] text-white p-6 rounded-2xl w-full max-w-sm shadow-xl">
    
    <!-- Title -->
    <h2 class="text-3xl font-bold tracking-wide mb-3">Trade</h2>

    <!-- Current Price -->
    <div id="unit-price" class="text-4xl font-extrabold tracking-tight mb-1">$78.42</div>
    
    <!-- Price Change Percentage -->
    <div class="text-[#22c55e] text-base font-semibold mb-6">+2.31%</div>

    <!-- Input Field -->
    <div class="mb-4">
      <label for="shares-input" class="block text-[#8b98a5] text-sm font-medium mb-2">Shares / Amount</label>
      <input 
        id="shares-input"
        type="number" 
        min="1"
        placeholder="Enter number of shares"
        class="w-full bg-[#181e2a] border border-[#263147] rounded-xl px-4 py-3.5 text-white placeholder-[#4b5563] text-lg focus:outline-none focus:border-[#22c55e] transition-colors"
      />
    </div>

    <!-- Live Total Cost Display -->
    <div class="flex justify-between items-center text-sm mb-6 bg-[#181e2a] px-4 py-2.5 rounded-lg border border-[#263147]/50">
      <span class="text-[#8b98a5]">Total Cost:</span>
      <span id="total-cost" class="font-bold text-[#22c55e] text-base">$0.00</span>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button 
        id="buy-btn"
        class="bg-[#38a169] hover:bg-[#2f855a] active:scale-95 text-white font-bold py-3.5 rounded-xl transition-all uppercase tracking-wider text-sm shadow-md">
        BUY
      </button>
      <button 
        id="sell-btn"
        class="bg-[#e53e3e] hover:bg-[#c53030] active:scale-95 text-white font-bold py-3.5 rounded-xl transition-all uppercase tracking-wider text-sm shadow-md">
        SELL
      </button>
    </div>

    <!-- Order Summary Output -->
    <div id="order-status" class="mt-4 text-center text-xs text-[#8b98a5] min-h-[20px]"></div>

  </div>

  <script>
    const sharePrice = 78.42;
    const sharesInput = document.getElementById('shares-input');
    const totalCostDisplay = document.getElementById('total-cost');
    const orderStatus = document.getElementById('order-status');
    const buyBtn = document.getElementById('buy-btn');
    const sellBtn = document.getElementById('sell-btn');

    // Automatically calculate total cost as user types
    sharesInput.addEventListener('input', () => {
      const shares = parseFloat(sharesInput.value);
      if (shares > 0) {
        const total = (shares * sharePrice).toFixed(2);
        totalCostDisplay.textContent = `$${total}`;
      } else {
        totalCostDisplay.textContent = '$0.00';
      }
      orderStatus.textContent = '';
    });

    // Buy Button Handler
    buyBtn.addEventListener('click', () => {
      const shares = parseFloat(sharesInput.value);
      if (shares > 0) {
        const total = (shares * sharePrice).toFixed(2);
        orderStatus.textContent = `Bought ${shares} share(s) for $${total}`;
        orderStatus.className = 'mt-4 text-center text-xs text-[#22c55e] font-semibold';
      } else {
        orderStatus.textContent = 'Please enter a valid amount of shares.';
        orderStatus.className = 'mt-4 text-center text-xs text-[#e53e3e] font-semibold';
      }
    });

    // Sell Button Handler
    sellBtn.addEventListener('click', () => {
      const shares = parseFloat(sharesInput.value);
      if (shares > 0) {
        const total = (shares * sharePrice).toFixed(2);
        orderStatus.textContent = `Sold ${shares} share(s) for $${total}`;
        orderStatus.className = 'mt-4 text-center text-xs text-[#e53e3e] font-semibold';
      } else {
        orderStatus.textContent = 'Please enter a valid amount of shares.';
        orderStatus.className = 'mt-4 text-center text-xs text-[#e53e3e] font-semibold';
      }
    });
  </script>

</body>
</html>
