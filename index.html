<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6 Siege Operator Guide</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    body {
        background: #101217;
        color: white;
    }
    header {
        background: #191c24;
        padding: 25px;
        text-align: center;
        border-bottom: 2px solid #f5c542;
    }
    header h1 {
        font-size: 32px;
        color: #f5c542;
    }
    header p {
        color: #aaa;
        margin-top: 8px;
    }
    .container {
        max-width: 1200px;
        margin: auto;
        padding: 25px;
    }
    .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }
    select, input {
        background: #1b1f28;
        color: white;
        border: 1px solid #3a3f4b;
        padding: 13px;
        border-radius: 7px;
        font-size: 15px;
    }
    select {
        min-width: 200px;
    }
    input {
        flex: 1;
        min-width: 200px;
    }
    .map-card {
        background: #191c24;
        border: 1px solid #303541;
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 25px;
    }
    .map-card h2 {
        color: #f5c542;
        margin-bottom: 8px;
    }
    .site {
        background: #222631;
        padding: 15px;
        margin-top: 12px;
        border-radius: 8px;
    }
    .site h3 {
        margin-bottom: 8px;
    }
    .operators {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 15px;
        margin-top: 12px;
    }
    .operator {
        background: #151820;
        padding: 17px;
        border-radius: 8px;
        border-left: 4px solid #f5c542;
    }
    .operator h4 {
        color: #f5c542;
        font-size: 19px;
        margin-bottom: 6px;
    }
    .operator p {
        color: #bbb;
        line-height: 1.4;
        font-size: 14px;
    }
    .role {
        display: inline-block;
        background: #303541;
        padding: 5px 8px;
        border-radius: 5px;
        font-size: 12px;
        margin-top: 8px;
        color: #ddd;
    }
    footer {
        text-align: center;
        padding: 30px;
        color: #777;
    }
    @media(max-width:600px) {
        header h1 {
            font-size: 24px;
        }
        .container {
            padding: 15px;
        }
    }
</style>
</head>
<body>
<header>
    <h1>R6 SIEGE OPERATOR GUIDE</h1>
    <p>Map • Site • Operator Recommendations</p>
</header>
<div class="container">
    <div class="controls">
        <select id="side" onchange="updateGuide()">
            <option value="all">Attack + Defense</option>
            <option value="attack">Attackers</option>
            <option value="defense">Defenders</option>
        </select>
        <select id="map" onchange="updateGuide()">
            <option value="all">All Maps</option>
            <option value="bank">Bank</option>
            <option value="border">Border</option>
            <option value="chalet">Chalet</option>
            <option value="clubhouse">Clubhouse</option>
            <option value="consulate">Consulate</option>
            <option value="kafe">Kafe</option>
            <option value="lair">Lair</option>
            <option value="nighthaven">Nighthaven Labs</option>
            <option value="fortress">Fortress</option>
            <option value="calypso">Calypso Casino</option>
            <option value="villa">Villa</option>
            <option value="oregon">Oregon</option>
            <option value="coastline">Coastline</option>
        </select>
        <input
            id="search"
            type="text"
            placeholder="Search operator or map..."
            oninput="updateGuide()"
        >
    </div>
    <div id="guide"></div>
</div>
<footer>
    R6 Siege Strategy Guide • Update operator/map data as the game changes
</footer>

function createOperator(name, description, side) {
    return `
        <div class="operator">
            <h4>${name}</h4>
            <p>${description}</p>
            <span class="role">
                ${side === "attack" ? "ATTACKER" : "DEFENDER"}
            </span>
        </div>
    `;
}
function updateGuide() {
    const selectedMap =
        document.getElementById("map").value;
    const selectedSide =
        document.getElementById("side").value;
    const search =
        document.getElementById("search")
        .value
        .toLowerCase();
    const guide =
        document.getElementById("guide");
    guide.innerHTML = "";
    Object.keys(maps).forEach(key => {
        if (selectedMap !== "all" && selectedMap !== key)
            return;
        const map = maps[key];
        if (
            search &&
            !map.name.toLowerCase().includes(search)
        )
            return;
        let html = `
            <div class="map-card">
                <h2>${map.name}</h2>
        `;
        map.sites.forEach(site => {
            html += `
                <div class="site">
                    <h3>${site.name}</h3>
            `;
            if (
                selectedSide === "all" ||
                selectedSide === "attack"
            ) {
                html += `
                    <h4>⚔️ Attackers</h4>
                    <div class="operators">
                `;
                site.attack.forEach(op => {
                    if (
                        !search ||
                        op[0].toLowerCase().includes(search)
                    ) {
                        html += createOperator(
                            op[0],
                            op[1],
                            "attack"
                        );
                    }
                });
                html += `</div>`;
            }
            if (
                selectedSide === "all" ||
                selectedSide === "defense"
            ) {
                html += `
                    <h4 style="margin-top:20px">
                        🛡️ Defenders
                    </h4>
                    <div class="operators">
                `;
                site.defense.forEach(op => {
                    if (
                        !search ||
                        op[0].toLowerCase().includes(search)
                    ) {
                        html += createOperator(
                            op[0],
                            op[1],
                            "defense"
                        );
                    }
                });
                html += `</div>`;
            }
            html += `</div>`;
        });
        html += `</div>`;
        guide.innerHTML += html;
    });
}
updateGuide();
</script>
</body>
</html>
