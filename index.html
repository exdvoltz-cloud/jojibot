<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6 Siege Operator Guide</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }
    body {
        background: #0b0f14;
        color: white;
    }
    header {
        background: linear-gradient(135deg, #111923, #182432);
        padding: 35px 20px;
        text-align: center;
        border-bottom: 2px solid #2d3947;
    }
    header h1 {
        font-size: 42px;
        letter-spacing: 2px;
    }
    header p {
        color: #9ba8b6;
        margin-top: 10px;
    }
    .controls {
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 20px;
    }
    #search {
        width: 100%;
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #344252;
        background: #121922;
        color: white;
        font-size: 16px;
        outline: none;
    }
    .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
    }
    button {
        background: #182330;
        color: white;
        border: 1px solid #344252;
        padding: 12px 18px;
        border-radius: 7px;
        cursor: pointer;
        transition: .2s;
    }
    button:hover,
    button.active {
        background: #3c82f6;
        border-color: #3c82f6;
    }
    .grid {
        max-width: 1200px;
        margin: auto;
        padding: 10px 20px 50px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
    }
    .card {
        background: #121922;
        border: 1px solid #263341;
        border-radius: 12px;
        padding: 20px;
        transition: .2s;
    }
    .card:hover {
        transform: translateY(-4px);
        border-color: #3c82f6;
        box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    .operator-name {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 5px;
    }
    .side {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
        margin: 7px 0 15px;
    }
    .attacker {
        background: #693535;
    }
    .defender {
        background: #31547a;
    }
    .section {
        margin-top: 14px;
    }
    .section-title {
        color: #7fa8dc;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }
    .ability {
        color: #fff;
        font-weight: bold;
    }
    .description {
        color: #aeb9c5;
        line-height: 1.5;
        font-size: 14px;
    }
    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
    }
    .tag {
        background: #202c38;
        color: #b8c8d8;
        padding: 5px 8px;
        border-radius: 5px;
        font-size: 11px;
    }
    .stats {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        border-top: 1px solid #263341;
        padding-top: 12px;
    }
    .stat {
        flex: 1;
        text-align: center;
    }
    .stat-label {
        display: block;
        color: #7f8d9c;
        font-size: 11px;
        text-transform: uppercase;
    }
    .stat-value {
        font-size: 16px;
        font-weight: bold;
        margin-top: 4px;
    }
    .gadget {
        color: #d9e3ed;
        font-size: 14px;
        margin-top: 3px;
    }
    .empty {
        text-align: center;
        color: #8794a3;
        padding: 60px 20px;
        grid-column: 1 / -1;
    }
    footer {
        text-align: center;
        padding: 30px;
        color: #687686;
        border-top: 1px solid #263341;
    }
    @media(max-width:600px) {
        header h1 {
            font-size: 30px;
        }
        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

    <h1>R6 SIEGE OPERATOR GUIDE</h1>
    <p>Operator abilities, specialties, gadgets and playstyle information</p>
</header>
<div class="controls">
    <input
        id="search"
        type="text"
        placeholder="Search an operator, ability, or specialty..."
        oninput="renderOperators()"
    >
    <div class="filters">
        <button class="active" onclick="setSide('All', this)">All</button>
        <button onclick="setSide('Attacker', this)">Attackers</button>
        <button onclick="setSide('Defender', this)">Defenders</button>
    </div>
    <div class="filters">
        <button onclick="setSpecialty('All', this)">All Specialties</button>
        <button onclick="setSpecialty('Intel', this)">Intel</button>
        <button onclick="setSpecialty('Support', this)">Support</button>
        <button onclick="setSpecialty('Front Line', this)">Front Line</button>
        <button onclick="setSpecialty('Map Control', this)">Map Control</button>
        <button onclick="setSpecialty('Anti-Gadget', this)">Anti-Gadget</button>
        <button onclick="setSpecialty('Anti-Entry', this)">Anti-Entry</button>
        <button onclick="setSpecialty('Trapper', this)">Trapper</button>

</div>
<div id="operatorGrid" class="grid"></div>
<footer>
    Rainbow Six Siege Operator Reference • Fan-made project
</footer>

{

let currentSide = "All";
let currentSpecialty = "All";
function setSide(side, button) {
    currentSide = side;
    document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active");
    });
    button.classList.add("active");
    renderOperators();
}
function setSpecialty(specialty, button) {
    currentSpecialty = specialty;
    document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active");
    });
    button.classList.add("active");
    renderOperators();
}
function renderOperators() {
    const grid = document.getElementById("operatorGrid");
    const search =
        document.getElementById("search")
        .value
        .toLowerCase();
    const filtered = operators.filter(operator => {
        const matchesSide =
            currentSide === "All" ||
            operator.side === currentSide;
        const matchesSpecialty =
            currentSpecialty === "All" ||
            operator.specialties.includes(currentSpecialty);
        const searchable =
            operator.name.toLowerCase().includes(search) ||
            operator.ability.toLowerCase().includes(search) ||
            operator.description.toLowerCase().includes(search) ||
            operator.specialties.join(" ").toLowerCase().includes(search);
        return matchesSide &&
               matchesSpecialty &&
               searchable;
    });
    if(filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty">
                <h2>No operators found</h2>
                <p>Try another search or filter.</p>
            </div>
        `;
        return;
    }
    grid.innerHTML = filtered.map(operator => {
        const sideClass =
            operator.side === "Attacker"
            ? "attacker"
            : "defender";
        return `
        <div class="card">
            <div class="operator-name">
                ${operator.name}
            </div>
            <span class="side ${sideClass}">
                ${operator.side}
            </span>
            <div class="section">
                <div class="section-title">
                    Specialties
                </div>
                <div class="tags">
                    ${operator.specialties.map(s =>
                        `<span class="tag">${s}</span>`
                    ).join("")}
                </div>
            </div>
            <div class="section">
                <div class="section-title">
                    Unique Ability
                </div>
                <div class="ability">
                    ${operator.ability}
                </div>
                <p class="description">
                    ${operator.description}
                </p>
            </div>
            <div class="section">
                <div class="section-title">
                    Secondary Gadgets
                </div>
                ${operator.gadgets.map(g =>
                    `<div class="gadget">• ${g}</div>`
                ).join("")}
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">
                        Health
                    </span>
                    <span class="stat-value">
                        ${operator.health}/3
                    </span>
                </div>
                <div class="stat">
                    <span class="stat-label">
                        Speed
                    </span>
                    <span class="stat-value">
                        ${operator.speed}/3
                    </span>
                </div>
                <div class="stat">
                    <span class="stat-label">
                        Difficulty
                    </span>
                    <span class="stat-value">
                        ${operator.difficulty}/3
                    </span>
                </div>
            </div>
        </div>
        `;
    }).join("");
}

</html>
