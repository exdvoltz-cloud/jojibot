<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Trading Bot Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric {
            font-size: 2rem;
            font-weight: bold;
            margin: 8px 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input, select, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
        }

        button {
            background-color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.stop { background-color: var(--red); }

        .log-box {
            height: 200px;
            overflow-y: auto;
            background: #0f172a;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .log-entry { margin-bottom: 6px; }
        .buy { color: var(--green); }
        .sell { color: var(--red); }
        .info { color: var(--text-dim); }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Controls -->
    <div class="card full-width">
        <h2>Bot Configuration</h2>
        <div class="controls">
            <input type="text" id="symbol" value="AAPL" placeholder="Ticker (e.g. AAPL)" style="width: 120px;">
            <input type="text" id="apiKey" placeholder="Finnhub API Key (Optional)">
            <button id="toggleBtn" onclick="toggleBot()">Start Bot</button>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 10px;">
            * Get a free API key at <strong>finnhub.io</strong>. Without a key, the bot runs in simulated price mode.
        </p>
    </div>

    <!-- Portfolio State -->
    <div class="card">
        <h2>Account Balance</h2>
        <div class="metric" id="cashBalance">$10,000.00</div>
        <span id="holdingStatus" style="color: var(--text-dim);">Holdings: 0 shares</span>
    </div>

    <!-- Market Price -->
    <div class="card">
        <h2>Current Price (<span id="tickerDisplay">AAPL</span>)</h2>
        <div class="metric" id="currentPrice">$0.00</div>
        <span id="priceChange" style="color: var(--text-dim);">Waiting for data...</span>
    </div>

    <!-- Live Execution Logs -->
    <div class="card full-width">
        <h2>Execution Log</h2>
        <div class="log-box" id="logBox">
            <div class="log-entry info">[System] Bot initialized. Press "Start Bot" to begin backtesting strategy.</div>
        </div>
    </div>
</div>

<script>
    let isRunning = false;
    let timer = null;
    
    // Trading state
    let cash = 10000.00;
    let shares = 0;
    let lastPrices = [];
    
    // Simple Strategy Settings
    const SMA_PERIOD = 3; // Uses a 3-period Moving Average trigger for demo speed

    function log(message, type = 'info') {
        const logBox = document.getElementById('logBox');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        const timestamp = new Date().toLocaleTimeString();
        entry.textContent = `[${timestamp}] ${message}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function fetchPrice(symbol, apiKey) {
        if (apiKey) {
            try {
                const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${apiKey}`);
                const data = await response.json();
                if (data.c) return data.c;
            } catch (err) {
                log('API error. Falling back to simulated pricing.', 'sell');
            }
        }
        
        // Fallback: Random walk price simulator
        const basePrice = lastPrices.length ? lastPrices[lastPrices.length - 1] : 175.00;
        const change = (Math.random() - 0.49) * 2; // Slight upward bias
        return parseFloat((basePrice + change).toFixed(2));
    }

    async function tick() {
        const symbol = document.getElementById('symbol').value.toUpperCase();
        const apiKey = document.getElementById('apiKey').value.trim();
        document.getElementById('tickerDisplay').textContent = symbol;

        const price = await fetchPrice(symbol, apiKey);
        document.getElementById('currentPrice').textContent = `$${price.toFixed(2)}`;
        
        lastPrices.push(price);
        if (lastPrices.length > SMA_PERIOD) lastPrices.shift();

        if (lastPrices.length === SMA_PERIOD) {
            const sma = lastPrices.reduce((a, b) => a + b, 0) / SMA_PERIOD;
            
            // Trading Decision Rules
            if (price > sma && shares === 0 && cash >= price) {
                // BUY Signal: Price crossed above SMA
                shares = Math.floor(cash / price);
                cash -= shares * price;
                log(`BUY SIGNAL: Bought ${shares} shares of ${symbol} at $${price.toFixed(2)}`, 'buy');
            } else if (price < sma && shares > 0) {
                // SELL Signal: Price fell below SMA
                cash += shares * price;
                log(`SELL SIGNAL: Sold ${shares} shares of ${symbol} at $${price.toFixed(2)}`, 'sell');
                shares = 0;
            }
        }

        // Update UI
        document.getElementById('cashBalance').textContent = `$${(cash + (shares * price)).toFixed(2)}`;
        document.getElementById('holdingStatus').textContent = `Cash: $${cash.toFixed(2)} | Holdings: ${shares} shares`;
    }

    function toggleBot() {
        const btn = document.getElementById('toggleBtn');
        if (isRunning) {
            clearInterval(timer);
            isRunning = false;
            btn.textContent = 'Start Bot';
            btn.classList.remove('stop');
            log('Bot execution paused.', 'info');
        } else {
            isRunning = true;
            btn.textContent = 'Stop Bot';
            btn.classList.add('stop');
            log('Bot started. Running strategy check every 3 seconds...', 'info');
            tick();
            timer = setInterval(tick, 3000);
        }
    }
</script>

</body>
</html>
